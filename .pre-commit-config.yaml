repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: end-of-file-fixer
        types: [file, python]
      - id: trailing-whitespace
        types: [file, python]
      - id: mixed-line-ending
      - id: check-added-large-files
        args: [--maxkb=4096]
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
  - repo: https://github.com/pycqa/isort
    rev: 6.0.0
    hooks:
      - id: isort
        name: isort (python)
        args: ["--profile", "black", "-l", "88", "--trailing-comma", "--multi-line", "3"]
  - repo: https://github.com/pycqa/flake8.git
    rev: 7.1.1
    hooks:
      - id: flake8
        types: [python]
        args: ["--max-line-length", "88", "--ignore", "E203,E501,W503,W504"]
  - repo: local
    hooks:
      - id: offline-default
        name: fail if default load path can pull weights
        entry: python scripts/check_offline_default.py
        language: system
        pass_filenames: false
        always_run: true
      - id: localhost-only
        name: fail if 0.0.0.0 bind is present
        entry: python scripts/check_no_wildcard_bind.py
        language: system
        pass_filenames: false
        always_run: true
      - id: no-committed-weights
        name: fail if model weights are committed
        entry: python scripts/check_no_weights.py
        language: system
        pass_filenames: false
        always_run: true
      - id: gitignore-weights
        name: fail if cache/weight paths are not gitignored
        entry: python scripts/check_gitignore_weights.py
        language: system
        pass_filenames: false
        always_run: true
