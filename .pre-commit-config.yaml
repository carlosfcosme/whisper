repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: end-of-file-fixer
        types: [file, python]
      - id: trailing-whitespace
        types: [file, python]
      - id: mixed-line-ending
      - id: check-added-large-files
        args: [--maxkb=4096]
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
  - repo: https://github.com/pycqa/isort
    rev: 6.0.0
    hooks:
      - id: isort
        name: isort (python)
        args: ["--profile", "black", "-l", "88", "--trailing-comma", "--multi-line", "3"]
  - repo: https://github.com/pycqa/flake8.git
    rev: 7.1.1
    hooks:
      - id: flake8
        types: [python]
        args: ["--max-line-length", "88", "--ignore", "E203,E501,W503,W504"]
  - repo: local
    hooks:
      - id: no-install-weight-fetch
        name: install.sh must not fetch model weights
        language: pygrep
        entry: 'load_model|_download|azureedge\.net'
        files: '^\.cursor/install\.sh$'
      - id: no-bind-all-interfaces
        name: application code must not bind 0.0.0.0
        language: pygrep
        entry: '0\.0\.0\.0'
        files: '^whisper/.*\.py$'
      - id: no-hub-fetch
        name: package code must not fetch from Hugging Face Hub
        language: pygrep
        entry: 'hf_hub_download|snapshot_download|from huggingface_hub|import huggingface_hub'
        files: '^whisper/.*\.py$'
