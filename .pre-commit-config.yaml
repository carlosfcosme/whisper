repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: end-of-file-fixer
        types: [file, python]
      - id: trailing-whitespace
        types: [file, python]
      - id: mixed-line-ending
      - id: check-added-large-files
        args: [--maxkb=4096]
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
  - repo: https://github.com/pycqa/isort
    rev: 6.0.0
    hooks:
      - id: isort
        name: isort (python)
        args: ["--profile", "black", "-l", "88", "--trailing-comma", "--multi-line", "3"]
  - repo: https://github.com/pycqa/flake8.git
    rev: 7.1.1
    hooks:
      - id: flake8
        types: [python]
        args: ["--max-line-length", "88", "--ignore", "E203,E501,W503,W504"]
  - repo: local
    hooks:
      - id: check-bind-localhost
        name: bind 127.0.0.1 only
        entry: python3 scripts/check_bind_localhost.py
        language: system
        pass_filenames: false
      - id: check-no-weights
        name: no committed weights or caches
        entry: python3 scripts/check_no_weights.py
        language: system
        pass_filenames: false
      - id: check-no-remote-fixtures
        name: no http(s)/huggingface fixture URLs
        entry: python3 scripts/check_no_remote_fixtures.py
        language: system
        pass_filenames: false
