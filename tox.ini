[tox]
envlist = offline
min_version = 4.0

[testenv:offline]
description = No-download offline tests with localhost-only binds
skip_install = true
allowlist_externals = pytest
setenv =
    WHISPER_OFFLINE = 1
    HF_HUB_OFFLINE = 1
    TRANSFORMERS_OFFLINE = 1
    HF_DATASETS_OFFLINE = 1
    WHISPER_BIND_HOST = 127.0.0.1
commands =
    pytest --durations=0 -vv -k "not test_transcribe" -m "not requires_cuda and not requires_weights"
