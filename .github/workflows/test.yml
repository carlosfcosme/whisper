name: test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  untracked-cache-weights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if weights, caches, or secrets are committed
        run: |
          set -euo pipefail
          tracked="$(git ls-files -- \
            '.cache' '.cache/**' 'cache' 'cache/**' 'weights' 'weights/**' \
            '.huggingface' '.huggingface/**' 'hub' 'hub/**' \
            '*.pt' '*.pth' '*.safetensors' '*.bin' \
            '.env' '.env.*')"
          if [ -n "$tracked" ]; then
            echo "These cache/weight/secret paths must stay untracked:" >&2
            printf '%s\n' "$tracked" >&2
            exit 1
          fi
          for path in \
            .cache/whisper/tiny.pt \
            cache/whisper/tiny.pt \
            weights/tiny.pt \
            .huggingface/hub/models--openai--whisper/tiny.pt \
            hub/tiny.safetensors \
            tiny.pt \
            model.pth \
            model.safetensors \
            model.bin \
            .env \
            .env.local
          do
            git check-ignore -q -- "$path"
          done
      - name: Fail if package code fetches from Hugging Face Hub
        run: |
          set -euo pipefail
          if git grep -nE 'hf_hub_download|snapshot_download|from huggingface_hub|import huggingface_hub' -- whisper; then
            echo "Package code must not call Hugging Face Hub" >&2
            exit 1
          fi
      - name: Fail if package binds all interfaces
        run: |
          set -euo pipefail
          if git grep -nF '0.0.0.0' -- whisper; then
            echo "Package code must bind 127.0.0.1 only" >&2
            exit 1
          fi
      - name: Fail if tests use remote fixture URLs
        run: python3 .github/scripts/fail-remote-fixture-urls.py
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: x64
      - name: Get pip cache dir
        id: pip-cache
        run: |
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
      - name: pip/pre-commit cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pip-cache.outputs.dir }}
            ~/.cache/pre-commit
          key: ${{ runner.os }}-pip-pre-commit-${{ hashFiles('**/.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pip-pre-commit
      - name: pre-commit
        run: |
          pip install --upgrade pre-commit
          pre-commit install --install-hooks
          pre-commit run --all-files
  whisper-test:
    needs: [pre-commit, untracked-cache-weights]
    runs-on: ubuntu-latest
    env:
      WHISPER_OFFLINE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.8'
            pytorch-version: 1.10.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.8'
            pytorch-version: 1.13.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.8'
            pytorch-version: 2.0.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.9'
            pytorch-version: 2.1.2
            numpy-requirement: "'numpy<2'"
          - python-version: '3.10'
            pytorch-version: 2.2.2
            numpy-requirement: "'numpy<2'"
          - python-version: '3.11'
            pytorch-version: 2.3.1
            numpy-requirement: "'numpy'"
          - python-version: '3.12'
            pytorch-version: 2.4.1
            numpy-requirement: "'numpy'"
          - python-version: '3.12'
            pytorch-version: 2.5.1
            numpy-requirement: "'numpy'"
          - python-version: '3.13'
            pytorch-version: 2.5.1
            numpy-requirement: "'numpy'"
    steps:
      - uses: conda-incubator/setup-miniconda@v3
      - run: conda install -n test ffmpeg python=${{ matrix.python-version }}
      - uses: actions/checkout@v4
      - run: echo "$CONDA/envs/test/bin" >> $GITHUB_PATH
      - run: pip3 install .["dev"] ${{ matrix.numpy-requirement }} torch==${{ matrix.pytorch-version }}+cpu --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Weight-free pytest (no WAN model pull)
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/whisper-empty-cache
        run: pytest --durations=0 -vv -k 'not test_transcribe' -m 'not requires_cuda and not requires_weights'
