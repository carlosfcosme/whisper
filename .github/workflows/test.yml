name: test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: x64
      - name: Get pip cache dir
        id: pip-cache
        run: |
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
      - name: pip/pre-commit cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pip-cache.outputs.dir }}
            ~/.cache/pre-commit
          key: ${{ runner.os }}-pip-pre-commit-${{ hashFiles('**/.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pip-pre-commit
      - name: pre-commit
        run: |
          pip install --upgrade pre-commit
          pre-commit install --install-hooks
          pre-commit run --all-files
  no-committed-weights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if model weights are committed
        run: bash .github/scripts/fail_if_weights_committed.sh
      - name: Fail if Hugging Face Hub is a project dependency
        run: |
          if grep -qi 'huggingface' pyproject.toml requirements.txt; then
            echo "error: Hugging Face Hub must not be a project dependency" >&2
            exit 1
          fi
  loopback-bind-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if bind host is not loopback
        run: bash .github/scripts/fail_if_non_loopback_bind.sh
  offline-install:
    runs-on: ubuntu-latest
    env:
      XDG_CACHE_HOME: ${{ runner.temp }}/whisper-xdg
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WHISPER_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline package install (no index, no deps, no models)
        run: |
          mkdir -p "$RUNNER_TEMP/offline-site"
          pip install --no-index --no-deps --no-build-isolation --target "$RUNNER_TEMP/offline-site" .
          if find "$RUNNER_TEMP/offline-site" -type f \( -name '*.pt' -o -name '*.pth' -o -name '*.ckpt' -o -name '*.safetensors' \) | grep -q .; then
            echo "error: offline install contained model weights" >&2
            find "$RUNNER_TEMP/offline-site" -type f \( -name '*.pt' -o -name '*.pth' -o -name '*.ckpt' -o -name '*.safetensors' \) >&2
            exit 1
          fi
      - name: Validate ignored weights
        run: bash .github/scripts/validate_ignored_weights.sh
      - name: Loopback bind and no committed/downloaded weights
        run: |
          bash .github/scripts/fail_if_non_loopback_bind.sh
          bash .github/scripts/fail_if_weights_committed.sh
          mkdir -p "$XDG_CACHE_HOME"
          bash .github/scripts/fail_if_weights_downloaded.sh
  whisper-test:
    needs: [pre-commit, no-committed-weights, loopback-bind-guard, offline-install]
    runs-on: ubuntu-latest
    env:
      XDG_CACHE_HOME: ${{ runner.temp }}/whisper-xdg
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WHISPER_OFFLINE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.8'
            pytorch-version: 1.10.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.8'
            pytorch-version: 1.13.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.8'
            pytorch-version: 2.0.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.9'
            pytorch-version: 2.1.2
            numpy-requirement: "'numpy<2'"
          - python-version: '3.10'
            pytorch-version: 2.2.2
            numpy-requirement: "'numpy<2'"
          - python-version: '3.11'
            pytorch-version: 2.3.1
            numpy-requirement: "'numpy'"
          - python-version: '3.12'
            pytorch-version: 2.4.1
            numpy-requirement: "'numpy'"
          - python-version: '3.12'
            pytorch-version: 2.5.1
            numpy-requirement: "'numpy'"
          - python-version: '3.13'
            pytorch-version: 2.5.1
            numpy-requirement: "'numpy'"
    steps:
      - uses: conda-incubator/setup-miniconda@v3
      - run: conda install -n test ffmpeg python=${{ matrix.python-version }}
      - uses: actions/checkout@v4
      - run: echo "$CONDA/envs/test/bin" >> $GITHUB_PATH
      - run: pip3 install .["dev"] ${{ matrix.numpy-requirement }} torch==${{ matrix.pytorch-version }}+cpu --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Weight-free tests (no Hub, no checkpoint download)
        run: |
          mkdir -p "$XDG_CACHE_HOME"
          pytest --durations=0 -vv -k 'not test_transcribe' -m 'not requires_cuda'
      - name: Fail if weights were downloaded
        run: bash .github/scripts/fail_if_weights_downloaded.sh
