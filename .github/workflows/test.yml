name: test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: x64
      - name: Get pip cache dir
        id: pip-cache
        run: |
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
      - name: pip/pre-commit cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pip-cache.outputs.dir }}
            ~/.cache/pre-commit
          key: ${{ runner.os }}-pip-pre-commit-${{ hashFiles('**/.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pip-pre-commit
      - name: pre-commit
        run: |
          pip install --upgrade pre-commit
          pre-commit install --install-hooks
          pre-commit run --all-files
  no-committed-weights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if model weights are committed
        run: python3 scripts/check_no_weights.py
  whisper-test:
    needs: [pre-commit, no-committed-weights]
    runs-on: ubuntu-latest
    env:
      WHISPER_CPU_ONLY: "1"
      WHISPER_NO_STORE: "1"
      WHISPER_OFFLINE: "1"
      WHISPER_NO_WEIGHT_DOWNLOAD: "1"
      HF_HUB_OFFLINE: "1"
      CUDA_VISIBLE_DEVICES: ""
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci-xdg-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.8'
            pytorch-version: 1.10.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.8'
            pytorch-version: 1.13.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.8'
            pytorch-version: 2.0.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.9'
            pytorch-version: 2.1.2
            numpy-requirement: "'numpy<2'"
          - python-version: '3.10'
            pytorch-version: 2.2.2
            numpy-requirement: "'numpy<2'"
          - python-version: '3.11'
            pytorch-version: 2.3.1
            numpy-requirement: "'numpy'"
          - python-version: '3.12'
            pytorch-version: 2.4.1
            numpy-requirement: "'numpy'"
          - python-version: '3.12'
            pytorch-version: 2.5.1
            numpy-requirement: "'numpy'"
          - python-version: '3.13'
            pytorch-version: 2.5.1
            numpy-requirement: "'numpy'"
    steps:
      - uses: conda-incubator/setup-miniconda@v3
      - run: conda install -n test ffmpeg python=${{ matrix.python-version }}
      - uses: actions/checkout@v4
      - run: echo "$CONDA/envs/test/bin" >> $GITHUB_PATH
      - run: pip3 install .["dev"] ${{ matrix.numpy-requirement }} torch==${{ matrix.pytorch-version }}+cpu --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Fail if model weights are committed
        run: python3 scripts/check_no_weights.py
      # CPU-only, no-store, offline: skip test_transcribe (would pull weights).
      - run: pytest --durations=0 -vv -k 'not test_transcribe' -m 'not requires_cuda'
      - name: Fail if the job stored weight files
        run: |
          hits=$(find "${XDG_CACHE_HOME}" "${HOME}/.cache/whisper" \( -name '*.pt' -o -name '*.pth' \) 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "CI must not store downloaded weights"
            echo "$hits"
            exit 1
          fi
          python3 -c "import whisper; assert whisper.default_device()=='cpu'"
