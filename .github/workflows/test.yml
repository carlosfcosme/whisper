name: test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  offline-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: git ls-files must not list weights or caches
        run: |
          set -euo pipefail
          tracked="$(git ls-files -- \
            '.cache' '.cache/**' \
            'cache' 'cache/**' \
            'weights' 'weights/**' \
            '.huggingface' '.huggingface/**' \
            '*.pt' '*.pth' '*.onnx' '*.safetensors' \
            '*.ckpt' '*.ggml' '*.gguf' '*.bin' '*.weights')"
          if [ -n "$tracked" ]; then
            echo "weight/cache paths must stay untracked:" >&2
            printf '%s\n' "$tracked" >&2
            exit 1
          fi
      - name: gitignore must cover weight/cache sample paths
        run: |
          set -euo pipefail
          for path in \
            .cache/whisper/tiny.pt \
            cache/whisper/tiny.pt \
            weights/tiny.pt \
            tiny.pt \
            model.pth \
            model.safetensors \
            model.bin
          do
            git check-ignore -q -- "$path"
          done
      - name: Python git ls-files guard
        run: python3 scripts/check_tracked_weights.py
      - name: Offline proofs (ignore, no download, bind 127.0.0.1)
        run: |
          python -m pip install pytest
          pytest tests/test_gitignore_weights.py tests/test_no_download.py tests/test_bind_guard.py -vv
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: x64
      - name: Get pip cache dir
        id: pip-cache
        run: |
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
      - name: pip/pre-commit cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pip-cache.outputs.dir }}
            ~/.cache/pre-commit
          key: ${{ runner.os }}-pip-pre-commit-${{ hashFiles('**/.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pip-pre-commit
      - name: pre-commit
        run: |
          pip install --upgrade pre-commit
          pre-commit install --install-hooks
          pre-commit run --all-files
  whisper-test:
    needs: [pre-commit, offline-proofs]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.8'
            pytorch-version: 1.10.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.8'
            pytorch-version: 1.13.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.8'
            pytorch-version: 2.0.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.9'
            pytorch-version: 2.1.2
            numpy-requirement: "'numpy<2'"
          - python-version: '3.10'
            pytorch-version: 2.2.2
            numpy-requirement: "'numpy<2'"
          - python-version: '3.11'
            pytorch-version: 2.3.1
            numpy-requirement: "'numpy'"
          - python-version: '3.12'
            pytorch-version: 2.4.1
            numpy-requirement: "'numpy'"
          - python-version: '3.12'
            pytorch-version: 2.5.1
            numpy-requirement: "'numpy'"
          - python-version: '3.13'
            pytorch-version: 2.5.1
            numpy-requirement: "'numpy'"
    steps:
      - uses: conda-incubator/setup-miniconda@v3
      - run: conda install -n test ffmpeg python=${{ matrix.python-version }}
      - uses: actions/checkout@v4
      - run: echo "$CONDA/envs/test/bin" >> $GITHUB_PATH
      - run: pip3 install .["dev"] ${{ matrix.numpy-requirement }} torch==${{ matrix.pytorch-version }}+cpu --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Pytest without model download
        run: |
          set -euo pipefail
          cache="${RUNNER_TEMP}/xdg-cache"
          mkdir -p "$cache"
          export XDG_CACHE_HOME="$cache"
          pytest --durations=0 -vv -k 'not test_transcribe' -m 'not requires_cuda and not requires_local_weights'
          if find "$cache" -type f \( -name '*.pt' -o -name '*.pth' -o -name '*.safetensors' \) | grep -q .; then
            echo "pytest downloaded weights into XDG_CACHE_HOME" >&2
            find "$cache" -type f >&2
            exit 1
          fi
