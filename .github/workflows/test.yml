name: test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  WHISPER_OFFLINE: "1"
  WHISPER_NO_WEIGHT_DOWNLOAD: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  offline-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Default load path is offline (no Hub, no weight pull)
        run: python scripts/check_offline_default.py
      - name: Localhost only (no 0.0.0.0 bind)
        run: python scripts/check_no_wildcard_bind.py
      - name: Fail if model weights are committed
        run: python scripts/check_no_weights.py
      - name: Cache/weight paths are gitignored
        run: python scripts/check_gitignore_weights.py
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (CPU torch) for policy pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy
          pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Policy tests (no downloads, loopback bind, weights ignored)
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/empty-xdg
        run: |
          mkdir -p "$XDG_CACHE_HOME"
          pytest --durations=0 -vv tests/test_ci_network_block.py tests/test_ci_loopback_bind.py tests/test_ci_cache_weights_ignored.py
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: x64
      - name: Get pip cache dir
        id: pip-cache
        run: |
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
      - name: pip/pre-commit cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pip-cache.outputs.dir }}
            ~/.cache/pre-commit
          key: ${{ runner.os }}-pip-pre-commit-${{ hashFiles('**/.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pip-pre-commit
      - name: pre-commit
        run: |
          pip install --upgrade pre-commit
          pre-commit install --install-hooks
          pre-commit run --all-files
  whisper-test:
    needs: pre-commit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.8'
            pytorch-version: 1.10.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.8'
            pytorch-version: 1.13.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.8'
            pytorch-version: 2.0.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.9'
            pytorch-version: 2.1.2
            numpy-requirement: "'numpy<2'"
          - python-version: '3.10'
            pytorch-version: 2.2.2
            numpy-requirement: "'numpy<2'"
          - python-version: '3.11'
            pytorch-version: 2.3.1
            numpy-requirement: "'numpy'"
          - python-version: '3.12'
            pytorch-version: 2.4.1
            numpy-requirement: "'numpy'"
          - python-version: '3.12'
            pytorch-version: 2.5.1
            numpy-requirement: "'numpy'"
          - python-version: '3.13'
            pytorch-version: 2.5.1
            numpy-requirement: "'numpy'"
    steps:
      - uses: conda-incubator/setup-miniconda@v3
      - run: conda install -n test ffmpeg python=${{ matrix.python-version }}
      - uses: actions/checkout@v4
      - run: echo "$CONDA/envs/test/bin" >> $GITHUB_PATH
      - run: pip3 install .["dev"] ${{ matrix.numpy-requirement }} torch==${{ matrix.pytorch-version }}+cpu --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Offline unit tests (no weight download, no Hub)
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/empty-xdg
        run: |
          mkdir -p "$XDG_CACHE_HOME"
          pytest --durations=0 -vv -k 'not test_transcribe' -m 'not requires_cuda and not requires_weights'
