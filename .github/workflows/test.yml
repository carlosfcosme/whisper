name: test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: x64
      - name: Get pip cache dir
        id: pip-cache
        run: |
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
      - name: pip/pre-commit cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pip-cache.outputs.dir }}
            ~/.cache/pre-commit
          key: ${{ runner.os }}-pip-pre-commit-${{ hashFiles('**/.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pip-pre-commit
      - name: pre-commit
        run: |
          pip install --upgrade pre-commit
          pre-commit install --install-hooks
          pre-commit run --all-files
  no-committed-weights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if weights are committed
        run: python3 scripts/check_no_weights.py
      - name: Verify cache/weight artifacts are gitignored
        run: python3 scripts/check_ignored_artifacts.py
  whisper-test:
    needs: [pre-commit, no-committed-weights]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.8'
            pytorch-version: 1.10.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.8'
            pytorch-version: 1.13.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.8'
            pytorch-version: 2.0.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.9'
            pytorch-version: 2.1.2
            numpy-requirement: "'numpy<2'"
          - python-version: '3.10'
            pytorch-version: 2.2.2
            numpy-requirement: "'numpy<2'"
          - python-version: '3.11'
            pytorch-version: 2.3.1
            numpy-requirement: "'numpy'"
          - python-version: '3.12'
            pytorch-version: 2.4.1
            numpy-requirement: "'numpy'"
          - python-version: '3.12'
            pytorch-version: 2.5.1
            numpy-requirement: "'numpy'"
          - python-version: '3.13'
            pytorch-version: 2.5.1
            numpy-requirement: "'numpy'"
    steps:
      - uses: conda-incubator/setup-miniconda@v3
      - run: conda install -n test ffmpeg python=${{ matrix.python-version }}
      - uses: actions/checkout@v4
      - run: echo "$CONDA/envs/test/bin" >> $GITHUB_PATH
      - run: pip3 install .["dev"] ${{ matrix.numpy-requirement }} torch==${{ matrix.pytorch-version }}+cpu --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Tests without Hub or weight downloads
        env:
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
          WHISPER_OFFLINE: "1"
          WHISPER_NO_STORE: "1"
          XDG_CACHE_HOME: ${{ github.workspace }}/.cache/whisper-ci
        run: pytest --durations=0 -vv -k 'not test_transcribe' -m 'not requires_cuda'
      - name: Bind-127 guard (fail on 0.0.0.0)
        env:
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_OFFLINE: "1"
          WHISPER_OFFLINE: "1"
          WHISPER_NO_STORE: "1"
        run: pytest tests/test_bind_guard.py -vv
      - name: Verify ignored artifacts and no weight cache
        run: |
          python3 scripts/check_ignored_artifacts.py
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          cache = Path(os.environ.get("XDG_CACHE_HOME", ".cache/whisper-ci"))
          leftover = []
          if cache.exists():
              leftover = [
                  p
                  for p in cache.rglob("*")
                  if p.suffix.lower() in {".pt", ".safetensors", ".bin", ".ckpt"}
              ]
          if leftover:
              print("weight artifacts were written:", *leftover, sep="\n  ", file=sys.stderr)
              sys.exit(1)
          print("no weight artifacts in XDG_CACHE_HOME")
          PY
        env:
          XDG_CACHE_HOME: ${{ github.workspace }}/.cache/whisper-ci
