name: test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      WHISPER_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools only (no torch, no model weights)
        run: pip install "black==25.1.0" "isort==6.0.0" "flake8==7.1.1"
      - name: Lint + offline / loopback guards
        run: bash scripts/ci_lint_test.sh
      - name: Enforce 127.0.0.1-only bind
        run: python3 scripts/check_loopback_bind.py
      - name: Block Hub and remote model download
        run: python3 scripts/check_no_download.py
      - name: Guard rejects a planted checkpoint
        run: |
          set -euo pipefail
          echo dummy > leaked.pt
          git add -f leaked.pt
          if python3 scripts/check_no_weights.py; then
            echo "expected check_no_weights.py to fail on leaked.pt" >&2
            exit 1
          fi
          git reset HEAD leaked.pt
          rm -f leaked.pt
      - name: Bind guard rejects all-interfaces host
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          import check_loopback_bind as chk
          serve = chk.load_serve(Path(".").resolve())
          all_if = ".".join(("0",) * 4)
          try:
              serve.normalize_bind_host(all_if)
          except serve.BindError:
              print("OK: refused", all_if)
          else:
              raise SystemExit("expected BindError for all-interfaces host")
          PY
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: x64
      - name: Get pip cache dir
        id: pip-cache
        run: |
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
      - name: pip/pre-commit cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pip-cache.outputs.dir }}
            ~/.cache/pre-commit
          key: ${{ runner.os }}-pip-pre-commit-${{ hashFiles('**/.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pip-pre-commit
      - name: pre-commit
        run: |
          pip install --upgrade pre-commit
          pre-commit install --install-hooks
          pre-commit run --all-files
  whisper-test:
    needs: [pre-commit, lint-test]
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      WHISPER_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.8'
            pytorch-version: 1.10.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.8'
            pytorch-version: 1.13.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.8'
            pytorch-version: 2.0.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.9'
            pytorch-version: 2.1.2
            numpy-requirement: "'numpy<2'"
          - python-version: '3.10'
            pytorch-version: 2.2.2
            numpy-requirement: "'numpy<2'"
          - python-version: '3.11'
            pytorch-version: 2.3.1
            numpy-requirement: "'numpy'"
          - python-version: '3.12'
            pytorch-version: 2.4.1
            numpy-requirement: "'numpy'"
          - python-version: '3.12'
            pytorch-version: 2.5.1
            numpy-requirement: "'numpy'"
          - python-version: '3.13'
            pytorch-version: 2.5.1
            numpy-requirement: "'numpy'"
    steps:
      - uses: conda-incubator/setup-miniconda@v3
      - run: conda install -n test ffmpeg python=${{ matrix.python-version }}
      - uses: actions/checkout@v4
      - run: echo "$CONDA/envs/test/bin" >> $GITHUB_PATH
      - run: pip3 install .["dev"] ${{ matrix.numpy-requirement }} torch==${{ matrix.pytorch-version }}+cpu --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      # Offline: never fetch named checkpoints or Hub artifacts in CI.
      - run: pytest --durations=0 -vv -k 'not test_transcribe' -m 'not requires_cuda'
