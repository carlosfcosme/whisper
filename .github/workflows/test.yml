name: test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  no-weights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if model weights or caches are committed
        run: python3 scripts/check_no_weights.py
      - name: Fail if install/CI/tests fetch from Hugging Face Hub
        run: python3 scripts/check_no_hf_hub.py
  bind-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest only (no torch, no model weights)
        run: python -m pip install pytest
      - name: Fail if serve/listen binds all interfaces
        run: pytest tests/test_bind.py tests/test_ci_guards.py -vv
      - name: Application sources must not contain 0.0.0.0
        run: |
          set -euo pipefail
          if git grep -nF '0.0.0.0' -- whisper .cursor; then
            echo "0.0.0.0 is not allowed in serve/listen paths" >&2
            exit 1
          fi
      - name: Weight and secret paths stay untracked
        run: python3 scripts/check_no_weights.py
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: x64
      - name: Get pip cache dir
        id: pip-cache
        run: |
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
      - name: pip/pre-commit cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pip-cache.outputs.dir }}
            ~/.cache/pre-commit
          key: ${{ runner.os }}-pip-pre-commit-${{ hashFiles('**/.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pip-pre-commit
      - name: pre-commit
        run: |
          pip install --upgrade pre-commit
          pre-commit install --install-hooks
          pre-commit run --all-files
  whisper-test:
    needs: [pre-commit, no-weights, bind-guard]
    runs-on: ubuntu-latest
    env:
      WHISPER_OFFLINE: "1"
      WHISPER_DEVICE: "cpu"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.8'
            pytorch-version: 1.10.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.8'
            pytorch-version: 1.13.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.8'
            pytorch-version: 2.0.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.9'
            pytorch-version: 2.1.2
            numpy-requirement: "'numpy<2'"
          - python-version: '3.10'
            pytorch-version: 2.2.2
            numpy-requirement: "'numpy<2'"
          - python-version: '3.11'
            pytorch-version: 2.3.1
            numpy-requirement: "'numpy'"
          - python-version: '3.12'
            pytorch-version: 2.4.1
            numpy-requirement: "'numpy'"
          - python-version: '3.12'
            pytorch-version: 2.5.1
            numpy-requirement: "'numpy'"
          - python-version: '3.13'
            pytorch-version: 2.5.1
            numpy-requirement: "'numpy'"
    steps:
      - uses: conda-incubator/setup-miniconda@v3
      - run: conda install -n test ffmpeg python=${{ matrix.python-version }}
      - uses: actions/checkout@v4
      - run: echo "$CONDA/envs/test/bin" >> $GITHUB_PATH
      - run: pip3 install .["dev"] ${{ matrix.numpy-requirement }} torch==${{ matrix.pytorch-version }}+cpu --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Fail if install downloaded model weights
        run: python3 scripts/assert_no_weight_cache.py
      - name: Weight-free CPU pytest (no Hub / no Azure pull)
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/whisper-empty-cache
          HF_HOME: ${{ runner.temp }}/hf-empty
        run: pytest --durations=0 -vv -k 'not test_transcribe' -m 'not requires_cuda and not requires_weights'
      - name: Fail if tests downloaded model weights
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/whisper-empty-cache
          HF_HOME: ${{ runner.temp }}/hf-empty
        run: python3 scripts/assert_no_weight_cache.py
