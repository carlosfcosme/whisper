name: test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  no-tracked-weights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: git ls-files must not list weights or caches
        run: |
          set -euo pipefail
          tracked="$(git ls-files -- \
            '.cache' '.cache/**' \
            'cache' 'cache/**' \
            'weights' 'weights/**' \
            '*.pt' '*.pth' '*.onnx' '*.safetensors' \
            '*.ckpt' '*.ggml' '*.gguf' '*.bin' '*.weights')"
          if [ -n "$tracked" ]; then
            echo "weight/cache paths must stay untracked:" >&2
            printf '%s\n' "$tracked" >&2
            exit 1
          fi
      - name: gitignore must cover weight/cache sample paths
        run: |
          set -euo pipefail
          for path in \
            .cache/whisper/tiny.pt \
            cache/whisper/tiny.pt \
            weights/tiny.pt \
            tiny.pt \
            model.pth \
            model.safetensors \
            model.bin
          do
            git check-ignore -q -- "$path"
          done
      - name: Python git ls-files guard
        run: python3 scripts/check_tracked_weights.py
  downloads-blocked:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      WHISPER_NO_WEIGHT_DOWNLOAD: "1"
      WHISPER_CPU_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Prove Hub and cache-miss downloads are refused
        run: python3 scripts/check_downloads_blocked.py
  loopback-bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove listeners bind 127.0.0.1 only
        run: python3 scripts/check_loopback_bind.py
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          architecture: x64
      - name: Get pip cache dir
        id: pip-cache
        run: |
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
      - name: pip/pre-commit cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pip-cache.outputs.dir }}
            ~/.cache/pre-commit
          key: ${{ runner.os }}-pip-pre-commit-${{ hashFiles('**/.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pip-pre-commit
      - name: pre-commit
        run: |
          pip install --upgrade pre-commit
          pre-commit install --install-hooks
          pre-commit run --all-files
  whisper-test:
    needs: [pre-commit, no-tracked-weights, downloads-blocked, loopback-bind]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      WHISPER_CPU_ONLY: "1"
      WHISPER_NO_WEIGHT_DOWNLOAD: "1"
      WHISPER_LOCALHOST_ONLY: "1"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.8'
            pytorch-version: 1.10.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.8'
            pytorch-version: 1.13.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.8'
            pytorch-version: 2.0.1
            numpy-requirement: "'numpy<2'"
          - python-version: '3.9'
            pytorch-version: 2.1.2
            numpy-requirement: "'numpy<2'"
          - python-version: '3.10'
            pytorch-version: 2.2.2
            numpy-requirement: "'numpy<2'"
          - python-version: '3.11'
            pytorch-version: 2.3.1
            numpy-requirement: "'numpy'"
          - python-version: '3.12'
            pytorch-version: 2.4.1
            numpy-requirement: "'numpy'"
          - python-version: '3.12'
            pytorch-version: 2.5.1
            numpy-requirement: "'numpy'"
          - python-version: '3.13'
            pytorch-version: 2.5.1
            numpy-requirement: "'numpy'"
    steps:
      - uses: conda-incubator/setup-miniconda@v3
      - run: conda install -n test ffmpeg python=${{ matrix.python-version }}
      - uses: actions/checkout@v4
      - run: echo "$CONDA/envs/test/bin" >> $GITHUB_PATH
      - run: pip3 install .["dev"] ${{ matrix.numpy-requirement }} torch==${{ matrix.pytorch-version }}+cpu --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      # No Hub / no weight download: skip test_transcribe (would pull checkpoints).
      - run: pytest --durations=0 -vv -k 'not test_transcribe' -m 'not requires_cuda'
